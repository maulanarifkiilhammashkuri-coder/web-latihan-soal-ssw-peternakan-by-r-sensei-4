<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis SSW Peternakan - Bagian 4 — Soal 157–210</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --bg-page: #f0f6ff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #dbeafe;
            --success-bg: #dcfce7;
            --success-border: #22c55e;
            --success-text: #15803d;
            --danger-bg: #fee2e2;
            --danger-border: #ef4444;
            --danger-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            margin: 0;
            padding: 16px 12px 40px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 780px;
        }

        /* Header Card */
        .header-card {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #ffffff;
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.25);
            margin-bottom: 16px;
            text-align: center;
        }

        .part-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header-card h1 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 700;
        }

        .header-card p {
            margin: 0 0 16px;
            font-size: 13.5px;
            opacity: 0.9;
        }

        .name-box {
            max-width: 380px;
            margin: 0 auto;
        }

        .name-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: #ffffff;
            color: var(--text-main);
            font-size: 14.5px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .name-input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.35);
        }

        /* Sticky Progress Bar */
        .sticky-bar {
            position: sticky;
            top: 8px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border: 1px solid var(--primary-border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* Result Summary Banner (Hanya muncul setelah Submit) */
        .result-card {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 22px 18px;
            margin-bottom: 18px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.15);
        }

        .result-card.visible {
            display: block;
        }

        .result-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 0 0 4px;
        }

        .result-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 16px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .score-box {
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: 12px;
            padding: 12px 8px;
        }

        .score-box.correct-box {
            background: var(--success-bg);
            border-color: var(--success-border);
        }

        .score-box.wrong-box {
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .score-num {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
        }

        .score-lbl {
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .sync-status {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        /* Buttons */
        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-filter {
            background: #f59e0b;
            color: #ffffff;
        }

        .btn-filter:hover {
            background: #d97706;
        }

        .btn-filter.active {
            background: #1e293b;
            color: #ffffff;
        }

        .btn-reset {
            background: #ffffff;
            color: var(--danger-text);
            border: 1.5px solid #fecaca;
        }

        .btn-reset:hover {
            background: #fef2f2;
        }

        .btn-submit-main {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.35);
            margin-top: 8px;
        }

        .btn-submit-main:hover {
            filter: brightness(1.05);
        }

        /* Question Card */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
            transition: border-color 0.2s;
        }

        .q-card.hidden-by-filter {
            display: none;
        }

        .q-card.card-correct {
            border-color: var(--success-border);
        }

        .q-card.card-wrong {
            border-color: var(--danger-border);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }

        .q-num {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .q-status-badge {
            display: none;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
        }

        .q-status-badge.badge-correct {
            display: inline-block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .q-status-badge.badge-wrong {
            display: inline-block;
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .q-text {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.55;
            margin: 0 0 14px;
            white-space: pre-line;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            cursor: pointer;
            font-size: 14.5px;
            line-height: 1.45;
            transition: all 0.15s ease;
            user-select: none;
        }

        .option-item:hover:not(.locked) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 600;
            color: var(--primary-dark);
        }

        .option-item.locked {
            cursor: default;
        }

        /* Highlight Benar/Salah (Hanya diterapkan setelah Submit) */
        .option-item.reveal-correct {
            background: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
            font-weight: 700;
        }

        .option-item.reveal-wrong {
            background: var(--danger-bg) !important;
            border-color: var(--danger-border) !important;
            color: var(--danger-text) !important;
            font-weight: 600;
        }

        .radio-dot {
            width: 18px;
            height: 18px;
            min-width: 18px;
            border-radius: 50%;
            border: 2px solid #94a3b8;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .option-item.selected .radio-dot {
            border-color: var(--primary);
            background: var(--primary);
            box-shadow: inset 0 0 0 3px #ffffff;
        }

        .option-item.reveal-correct .radio-dot {
            border-color: var(--success-border);
            background: var(--success-border);
            box-shadow: inset 0 0 0 3px #ffffff;
        }

        .option-item.reveal-wrong .radio-dot {
            border-color: var(--danger-border);
            background: var(--danger-border);
            box-shadow: inset 0 0 0 3px #ffffff;
        }

        /* Pembahasan / Kunci Jawaban (Tersembunyi sebelum Submit) */
        .explanation-box {
            display: none;
            margin-top: 12px;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 13.5px;
            line-height: 1.5;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            color: var(--text-main);
        }

        .explanation-box.visible {
            display: block;
        }

        .footer-controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .empty-filter-msg {
            display: none;
            text-align: center;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            padding: 20px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .header-card h1 {
                font-size: 19px;
            }
            .q-card {
                padding: 15px 13px;
            }
            .option-item {
                padding: 11px 12px;
                font-size: 14px;
            }
            .score-num {
                font-size: 19px;
            }
            .action-row .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-card">
        <div class="part-badge" id="part-badge">PART_4_SOAL_157_210</div>
        <h1>Kuis Mandiri SSW Peternakan</h1>

        </div>
    </div>

    <!-- Sticky Progress -->
    <div class="sticky-bar">
        <div class="progress-top">
            <span>Terjawab: <strong id="answered-text">0 / 0</strong> soal</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Hasil Akhir (Muncul HANYA setelah klik Submit) -->
    <div class="result-card" id="result-card">
        <h2 class="result-title">Hasil Kuis — <span id="res-name">Peserta</span></h2>
        <p class="result-subtitle" id="res-part">Bagian 4 — Soal 157–210</p>

        <div class="score-grid">
            <div class="score-box">
                <div class="score-num" style="color: var(--primary);" id="res-score">0</div>
                <div class="score-lbl">Nilai Akhir</div>
            </div>
            <div class="score-box correct-box">
                <div class="score-num" style="color: var(--success-text);" id="res-correct">0</div>
                <div class="score-lbl">Benar</div>
            </div>
            <div class="score-box wrong-box">
                <div class="score-num" style="color: var(--danger-text);" id="res-wrong">0</div>
                <div class="score-lbl">Salah / Kosong</div>
            </div>
        </div>

        <div class="sync-status" id="sync-status"></div>

        <div class="action-row">
            <button type="button" class="btn btn-filter" id="btn-filter-wrong" onclick="toggleWrongFilter()">
                🔍 Lihat Hanya Salah (<span id="wrong-count-label">0</span>)
            </button>
            <button type="button" class="btn btn-reset" onclick="resetQuiz()">
                🔄 Ulangi Kuis
            </button>
        </div>
    </div>

    <div class="empty-filter-msg" id="empty-filter-msg">
        🎉 Luar biasa! Tidak ada jawaban yang salah pada bagian ini.
    </div>

    <!-- Daftar Soal -->
    <div id="quiz-list"></div>

    <!-- Tombol Submit & Reset Bawah -->
    <div class="footer-controls">
        <button type="button" class="btn btn-submit-main" id="btn-submit" onclick="submitQuiz()">
            ✅ Submit & Lihat Hasil
        </button>
        <button type="button" class="btn btn-reset" style="width: 100%;" onclick="resetQuiz()">
            🔄 Ulangi Kuis & Hapus Progres
        </button>
    </div>
</div>

// ============================================================================
// 3. STATE & LOGIKA APLIKASI
// ============================================================================
let userAnswers = {};
let isSubmitted = false;
let filterWrongOnly = false;

function loadFromStorage() {
    try {
        const savedName = localStorage.getItem(STORAGE_KEY_NAME);
        if (savedName) {
            document.getElementById("participant-name").value = savedName;
        }
        const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
        if (savedAnswers) {
            userAnswers = JSON.parse(savedAnswers) || {};
        }
        const savedSubmitted = localStorage.getItem(STORAGE_KEY_SUBMITTED);
        isSubmitted = savedSubmitted === "true";
    } catch (e) {
        console.warn("Gagal membaca localStorage:", e);
    }
}

function saveToStorage() {
    try {
        localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
        localStorage.setItem(STORAGE_KEY_SUBMITTED, String(isSubmitted));
    } catch (e) {
        console.warn("Gagal menyimpan ke localStorage:", e);
    }
}

document.getElementById("participant-name").addEventListener("input", function (e) {
    try {
        localStorage.setItem(STORAGE_KEY_NAME, e.target.value);
    } catch (err) {}
});

function getOptionKey(optionText) {
    return optionText.trim().charAt(0).toLowerCase();
}

function updateProgressUI() {
    const total = QUESTIONS.length;
    let answered = 0;
    QUESTIONS.forEach((q, idx) => {
        if (userAnswers[idx] !== undefined && userAnswers[idx] !== null) {
            answered++;
        }
    });
    const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById("answered-text").textContent = `${answered} / ${total}`;
    document.getElementById("progress-percent").textContent = `${pct}%`;
    document.getElementById("progress-fill").style.width = `${pct}%`;
}

function selectOption(qIndex, optKey) {
    // Jika sudah disubmit, kunci pilihan agar tidak bisa diubah sebelum Ulangi Kuis
    if (isSubmitted) return;

    userAnswers[qIndex] = optKey;
    saveToStorage();
    renderQuestions();
    updateProgressUI();
}

function renderQuestions() {
    const listEl = document.getElementById("quiz-list");
    listEl.innerHTML = "";

    let visibleCount = 0;

    QUESTIONS.forEach((q, idx) => {
        const selectedKey = userAnswers[idx] || null;
        const correctKey = q.answer.trim().toLowerCase();
        const isCorrect = selectedKey === correctKey;

        // Filter hanya salah setelah submit
        if (isSubmitted && filterWrongOnly && isCorrect) {
            return;
        }
        visibleCount++;

        const card = document.createElement("div");
        card.className = "q-card";
        if (isSubmitted) {
            card.classList.add(isCorrect ? "card-correct" : "card-wrong");
        }

        // Header nomor & status (status hanya muncul setelah Submit)
        const header = document.createElement("div");
        header.className = "q-header";

        const numBadge = document.createElement("span");
        numBadge.className = "q-num";
        numBadge.textContent = `Soal ${idx + 1} (No. ${q.id})`;
        header.appendChild(numBadge);

        if (isSubmitted) {
            const statusBadge = document.createElement("span");
            statusBadge.className = `q-status-badge ${isCorrect ? "badge-correct" : "badge-wrong"}`;
            statusBadge.textContent = isCorrect ? "✓ Benar" : (selectedKey ? "✕ Salah" : "• Tidak Dijawab");
            header.appendChild(statusBadge);
        }

        card.appendChild(header);

        // Teks Pertanyaan
        const qText = document.createElement("div");
        qText.className = "q-text";
        qText.textContent = q.question;
        card.appendChild(qText);

        // Pilihan Jawaban
        const optList = document.createElement("div");
        optList.className = "options-list";

        q.options.forEach((optStr) => {
            const optKey = getOptionKey(optStr);
            const optItem = document.createElement("div");
            optItem.className = "option-item";

            if (!isSubmitted) {
                if (selectedKey === optKey) {
                    optItem.classList.add("selected");
                }
                optItem.onclick = () => selectOption(idx, optKey);
            } else {
                // Setelah Submit: tampilkan highlight hijau/merah
                optItem.classList.add("locked");
                if (optKey === correctKey) {
                    optItem.classList.add("reveal-correct");
                } else if (selectedKey === optKey && optKey !== correctKey) {
                    optItem.classList.add("reveal-wrong");
                }
            }

            const dot = document.createElement("span");
            dot.className = "radio-dot";

            const label = document.createElement("span");
            label.textContent = optStr;

            optItem.appendChild(dot);
            optItem.appendChild(label);
            optList.appendChild(optItem);
        });

        card.appendChild(optList);

        // Kunci jawaban & pembahasan WAJIB disembunyikan sebelum Submit
        if (isSubmitted) {
            const correctOptionObj = q.options.find(o => getOptionKey(o) === correctKey) || q.answer.toUpperCase();
            const expBox = document.createElement("div");
            expBox.className = "explanation-box visible";
            expBox.innerHTML = `<strong>Kunci Jawaban:</strong> ${correctOptionObj}<br><strong>Pembahasan:</strong> ${q.explanation}`;
            card.appendChild(expBox);
        }

        listEl.appendChild(card);
    });

    const emptyMsg = document.getElementById("empty-filter-msg");
    if (isSubmitted && filterWrongOnly && visibleCount === 0) {
        emptyMsg.style.display = "block";
    } else {
        emptyMsg.style.display = "none";
    }
}

function showScoreSummary(sendToSheets = false) {
    const nameVal = document.getElementById("participant-name").value.trim();
    const total = QUESTIONS.length;
    let correctCount = 0;

    QUESTIONS.forEach((q, idx) => {
        const selectedKey = userAnswers[idx] || null;
        if (selectedKey === q.answer.trim().toLowerCase()) {
            correctCount++;
        }
    });

    const wrongCount = total - correctCount;
    const scorePct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    document.getElementById("res-name").textContent = nameVal || "Peserta";
    document.getElementById("res-score").textContent = `${scorePct}%`;
    document.getElementById("res-correct").textContent = correctCount;
    document.getElementById("res-wrong").textContent = wrongCount;
    document.getElementById("wrong-count-label").textContent = wrongCount;

    const resultCard = document.getElementById("result-card");
    resultCard.classList.add("visible");

    const submitBtn = document.getElementById("btn-submit");
    submitBtn.style.display = "none";

    const syncEl = document.getElementById("sync-status");
    if (sendToSheets && ENABLE_SHEETS_SYNC && GOOGLE_SCRIPT_URL) {
        syncEl.textContent = "⏳ Mengirim skor ke Google Sheets...";
        const payload = {
            nama: nameVal,
            paket: PACKET_NAME,
            part_id: PART_ID,
            benar: correctCount,
            salah: wrongCount,
            total: total,
            persentase: scorePct
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            syncEl.textContent = "✅ Skor berhasil dikirim ke Google Sheets.";
        })
        .catch(() => {
            syncEl.textContent = "⚠️ Skor tersimpan di perangkat (gagal terhubung ke Google Sheets).";
        });
    } else if (ENABLE_SHEETS_SYNC && GOOGLE_SCRIPT_URL) {
        syncEl.textContent = "✅ Kuis sudah disubmit. Tekan 'Ulangi Kuis' untuk mengerjakan ulang.";
    }
}

function submitQuiz() {
    const nameInput = document.getElementById("participant-name");
    const nameVal = nameInput.value.trim();

    if (!nameVal) {
        alert("⚠️ Harap masukkan Nama Lengkap Peserta terlebih dahulu sebelum menekan Submit!");
        nameInput.focus();
        nameInput.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
    }

    const total = QUESTIONS.length;
    let answered = 0;
    QUESTIONS.forEach((_, idx) => {
        if (userAnswers[idx] !== undefined && userAnswers[idx] !== null) {
            answered++;
        }
    });

    if (answered < total) {
        const yakin = confirm(`Anda baru menjawab ${answered} dari ${total} soal. Tetap Submit dan lihat hasil sekarang?`);
        if (!yakin) return;
    }

    isSubmitted = true;
    filterWrongOnly = false;
    saveToStorage();
    renderQuestions();
    showScoreSummary(true);

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleWrongFilter() {
    if (!isSubmitted) return;
    filterWrongOnly = !filterWrongOnly;
    const btn = document.getElementById("btn-filter-wrong");
    const wrongCount = document.getElementById("wrong-count-label").textContent;

    if (filterWrongOnly) {
        btn.classList.add("active");
        btn.innerHTML = `📋 Tampilkan Semua Soal`;
    } else {
        btn.classList.remove("active");
        btn.innerHTML = `🔍 Lihat Hanya Salah (<span id="wrong-count-label">${wrongCount}</span>)`;
    }
    renderQuestions();
}

function resetQuiz() {
    if (!confirm("Ulangi kuis dari awal? Semua jawaban pada bagian ini akan dihapus.")) {
        return;
    }
    userAnswers = {};
    isSubmitted = false;
    filterWrongOnly = false;

    try {
        localStorage.removeItem(STORAGE_KEY_ANSWERS);
        localStorage.removeItem(STORAGE_KEY_SUBMITTED);
    } catch (e) {}

    document.getElementById("result-card").classList.remove("visible");
    document.getElementById("empty-filter-msg").style.display = "none";
    document.getElementById("sync-status").textContent = "";

    const btnFilter = document.getElementById("btn-filter-wrong");
    btnFilter.classList.remove("active");
    btnFilter.innerHTML = `🔍 Lihat Hanya Salah (<span id="wrong-count-label">0</span>)`;

    const submitBtn = document.getElementById("btn-submit");
    submitBtn.style.display = "inline-flex";

    updateProgressUI();
    renderQuestions();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// Inisialisasi saat halaman dimuat
loadFromStorage();
updateProgressUI();
renderQuestions();
if (isSubmitted) {
    showScoreSummary(false);
}
</script>
</body>
</html>
